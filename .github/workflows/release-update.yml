name: Build automatic update asset
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  update-asset:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run test:ui
      - run: npm run build:update
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
      - name: Upload update bundle to this release
        run: gh release upload "$env:RELEASE_TAG" dist/token-glance-update.json --repo "$env:GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
